<!doctype html><html><head><link rel="stylesheet" href="../tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;font-family:var(--font-body);background:linear-gradient(90deg,var(--navy-300),var(--lavender-200));}
.wrap{padding:24px}
.card{max-width:440px;background:var(--white);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:16px 20px;display:grid;grid-template-columns:1fr auto;gap:2px 16px}
h3{margin:0;font:700 16px/22px var(--font-body);color:var(--ink-900)}
.client{font-size:12px;color:var(--text-muted)}
.meta{font-size:11px;color:var(--text-muted);margin-top:6px}
.status{font-size:11px;color:var(--text-muted);align-self:end;text-align:right}
.sw{display:flex;margin-top:10px}.sw i{width:16px;height:16px}
.go{width:32px;height:32px;border-radius:var(--radius-pill);border:0;background:var(--lavender-100);color:var(--navy-700);align-self:end;justify-self:end;font-size:16px}
</style></head><body><div class="wrap"><div class="card">
<div><h3>Nessa's June Apartment</h3><div class="client">Client: Nessa Hoang</div><div class="meta">Created: 11/12/2025, 11:55:26PM</div>
<div class="sw"><i style="background:var(--orange-500)"></i><i style="background:var(--navy-700)"></i><i style="background:var(--peach-100)"></i><i style="background:var(--navy-300)"></i></div></div>
<div style="display:grid;align-content:space-between"><span class="status">Status: Draft</span><button class="go" aria-label="Open project">&rarr;</button></div>
</div></div></body></html>
