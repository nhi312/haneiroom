<!doctype html><html><head><link rel="stylesheet" href="../tokens.css"><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{margin:0;font-family:var(--font-body);background:linear-gradient(90deg,var(--navy-300),var(--lavender-200));}
.wrap{display:flex;gap:12px;padding:24px;flex-wrap:wrap;align-items:center}
.chip{height:28px;padding:0 16px;border-radius:var(--radius-pill);font:500 12px/28px var(--font-body);border:0}
.off{background:var(--grey-100);color:var(--ink-900)}
.on{background:var(--navy-700);color:var(--white)}
.count{background:var(--white);color:var(--ink-900);box-shadow:var(--shadow-sm)}
</style></head><body><div class="wrap">
<button class="chip off">Accent Chair</button><button class="chip on" aria-pressed="true">Sofa</button><button class="chip off">Ottoman</button><button class="chip on" aria-pressed="true">Dining Chair</button><span class="chip count">2/10 Picked</span>
</div></body></html>
