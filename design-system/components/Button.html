<!doctype html><html><head><link rel="stylesheet" href="../tokens.css"><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:var(--font-body);background:var(--cream-50) url(../textures/paper.svg) repeat;}
.stage{position:relative;padding:28px 24px;overflow:hidden}
.stage>img{position:absolute;pointer-events:none}
.wrap{position:relative;display:grid;grid-template-columns:120px auto auto;gap:18px 20px;align-items:center;justify-content:start}
.lbl{font-size:12px;color:var(--text-muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:var(--radius-pill);
  border:1px solid var(--glass-edge);font:600 16px/20px var(--font-body);cursor:pointer;text-decoration:none;
  background:var(--glass-white);color:var(--navy-700);box-shadow:var(--shadow-glass);
  -webkit-backdrop-filter:blur(var(--blur-glass)) saturate(1.4);backdrop-filter:blur(var(--blur-glass)) saturate(1.4);
  transition:background .2s,color .2s,translate .2s}
.btn:hover,.btn.is-hover{background:rgba(255,255,255,.8);translate:0 -1px}
.btn--warm{background:var(--glass-orange);color:var(--brown-900)}
.btn--warm:hover,.btn--warm.is-hover{background:var(--orange-500)}
.btn--navy.is-active{background:var(--navy-700);color:var(--white);border-color:rgba(255,255,255,.35)}
.btn--icon{width:48px;padding:0}
.btn img{width:20px;height:20px}
.btn:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
</style></head><body>
<div class="stage">
  <img src="../doodles/squiggle.svg" alt="" style="right:-20px;top:6px;width:260px">
  <img src="../doodles/star.svg" alt="" style="right:220px;bottom:-30px;width:90px">
  <div class="wrap">
    <span class="lbl">Primary (warm glass)</span><a class="btn btn--warm" href="#">Explore HaneiRoom</a><a class="btn btn--warm is-hover" href="#">Explore HaneiRoom</a>
    <span class="lbl">Secondary (glass)</span><a class="btn" href="#">How It Works</a><a class="btn is-hover" href="#">How It Works</a>
    <span class="lbl">Selected / icon</span><a class="btn btn--navy is-active" href="#">Ask AI</a><button class="btn btn--icon" aria-label="Next"><img src="../icons/chevron-right.svg" alt=""></button>
  </div>
</div>
</body></html>
