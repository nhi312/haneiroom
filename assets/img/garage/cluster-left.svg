<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 720" width="420" height="720">
  <!-- HaneiRoom renovation workshop · left wall: pegboard of hand tools, workbench with vise. Floor is y=720. -->
  <!-- pegboard -->
  <rect x="40" y="60" width="300" height="300" rx="6" fill="#e6c79c"/>
  <g fill="#c98d5a">
    <circle cx="70" cy="90" r="4"/><circle cx="110" cy="90" r="4"/><circle cx="150" cy="90" r="4"/><circle cx="190" cy="90" r="4"/><circle cx="230" cy="90" r="4"/><circle cx="270" cy="90" r="4"/><circle cx="310" cy="90" r="4"/>
    <circle cx="70" cy="330" r="4"/><circle cx="110" cy="330" r="4"/><circle cx="150" cy="330" r="4"/><circle cx="190" cy="330" r="4"/><circle cx="230" cy="330" r="4"/><circle cx="270" cy="330" r="4"/><circle cx="310" cy="330" r="4"/>
  </g>
  <!-- hammer -->
  <rect x="78" y="128" width="14" height="150" rx="6" fill="#c98d5a"/>
  <path d="M58 104h52c6 0 10 4 10 10v10c0 4-3 6-6 6H62c-6 0-8-4-8-8v-14c0-2 2-4 4-4Z" fill="#253a82"/>
  <!-- scissors -->
  <g fill="none" stroke="#ff912c" stroke-width="7"><circle cx="138" cy="122" r="13"/><circle cx="170" cy="122" r="13"/></g>
  <path d="M146 134l18 88M162 134l-12 88" stroke="#93a4de" stroke-width="7" stroke-linecap="round"/>
  <!-- screwdrivers -->
  <rect x="200" y="104" width="16" height="50" rx="6" fill="#ff912c"/><rect x="205" y="154" width="6" height="70" fill="#9aa3b5"/>
  <rect x="226" y="104" width="16" height="44" rx="6" fill="#7fb07a"/><rect x="231" y="148" width="6" height="64" fill="#9aa3b5"/>
  <!-- wrench -->
  <path d="M264 108a16 16 0 1 1 22 0l-4 6v112a7 7 0 0 1-14 0V114Z" fill="#9aa3b5"/>
  <circle cx="275" cy="100" r="7" fill="#e6c79c"/>
  <!-- pliers -->
  <path d="M302 112l10 44 10-44" fill="none" stroke="#253a82" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M306 156l-6 80M318 156l6 80" stroke="#a85a22" stroke-width="9" stroke-linecap="round"/>
  <!-- masking tape roll -->
  <circle cx="110" cy="300" r="22" fill="#fbe3cc"/><circle cx="110" cy="300" r="10" fill="#e6c79c"/>
  <!-- clamp -->
  <path d="M160 268h56v14h-42v38h42v14h-56Z" fill="#253a82"/>
  <rect x="206" y="282" width="8" height="38" fill="#9aa3b5"/>

  <!-- workbench -->
  <rect x="20" y="430" width="340" height="22" rx="3" fill="#c98d5a"/>
  <rect x="34" y="452" width="16" height="268" fill="#9b6a3f"/>
  <rect x="330" y="452" width="16" height="268" fill="#9b6a3f"/>
  <rect x="34" y="600" width="312" height="14" fill="#9b6a3f"/>
  <!-- vise on the bench -->
  <rect x="250" y="392" width="76" height="38" rx="4" fill="#253a82"/>
  <rect x="236" y="400" width="18" height="22" rx="3" fill="#93a4de"/>
  <rect x="210" y="408" width="30" height="6" rx="3" fill="#9aa3b5"/>
  <!-- offcut held in the vise, pencil and set square -->
  <rect x="270" y="372" width="70" height="20" rx="2" fill="#e6c79c"/>
  <path d="M60 428l70-40v40Z" fill="#fcc490"/>
  <rect x="150" y="414" width="70" height="8" rx="4" fill="#ff912c" transform="rotate(-6 185 418)"/>
  <!-- under the bench: plank offcuts and a paint bucket -->
  <rect x="60" y="560" width="140" height="16" rx="2" fill="#e6c79c"/>
  <rect x="72" y="576" width="120" height="16" rx="2" fill="#dcb486"/>
  <path d="M60 640h82l-8 80H68Z" fill="#fffdf8"/>
  <path d="M60 640h82v14c-10 8-16-2-24 6-8 6-14-4-24 2-10 6-16-4-34-6Z" fill="#93a4de"/>
  <path d="M70 640c0-30 62-30 62 0" fill="none" stroke="#9aa3b5" stroke-width="5"/>
  <rect x="200" y="644" width="110" height="76" rx="3" fill="#dcb486"/>
  <rect x="246" y="644" width="18" height="76" fill="#eedcb6"/>

  <!-- long planks leaning on the bench -->
  <rect x="356" y="380" width="22" height="340" rx="3" fill="#e6c79c" transform="rotate(-7 367 550)"/>
  <rect x="382" y="400" width="22" height="320" rx="3" fill="#c98d5a" transform="rotate(-4 393 560)"/>
</svg>
